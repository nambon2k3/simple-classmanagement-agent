[project]
name = "class-management"
version = "0.1.0"
description = "AI-powered assistant for classroom management"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "D",    # pydocstyle
    "ANN",  # flake8-annotations
]
ignore = [
    "D100",    # module docstring is enforced by review, not every __init__
    "D104",
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "ANN401",  # allow typing.Any where it is genuinely dynamic
    "B008",    # FastAPI's Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"alembic/**" = ["D", "ANN", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
